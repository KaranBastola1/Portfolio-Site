<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karan | Graphic Designer & Video Editor</title>
<meta name="description" content="Portfolio of Karan: reels, long-form video, logo design and social media design.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F4; --card:#FFFFFF; --ink:#12172B; --muted:#5B6379; --line:#D9DDE6; --accent:#3D5AFE; --accent-ink:#FFFFFF;
  --head:"Bricolage Grotesque","Segoe UI",Arial,sans-serif; --body:"DM Sans","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0F1220;--card:#181C30;--ink:#EEF0F8;--muted:#9AA2BC;--line:#2A3050;--accent:#7C93FF;--accent-ink:#0F1220}
}
:root[data-theme="dark"]{--bg:#0F1220;--card:#181C30;--ink:#EEF0F8;--muted:#9AA2BC;--line:#2A3050;--accent:#7C93FF;--accent-ink:#0F1220}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.65;font-size:17px}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:var(--head);line-height:1.08;letter-spacing:-.02em}

/* nav */
header{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-family:var(--head);font-weight:800;font-size:20px;text-decoration:none}
.links{display:flex;gap:18px;align-items:center;font-size:15px}
.links a{text-decoration:none;color:var(--muted)}
.links a:hover{color:var(--ink)}
.theme{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer}
@media(max-width:900px){.links a{display:none}}

/* hero */
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:56px;align-items:center;padding:72px 0 56px}
.hero h1{font-size:clamp(46px,8vw,96px);font-weight:800}
.hero .role{font-family:var(--head);font-size:clamp(20px,2.6vw,28px);margin:18px 0 14px;color:var(--accent)}
.hero p{color:var(--muted);max-width:52ch}
.btns{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}
.btn{display:inline-block;padding:12px 22px;border-radius:99px;text-decoration:none;font-weight:700;font-size:15px;border:1px solid var(--ink)}
.btn.main{background:var(--ink);color:var(--bg)}
.btn.main:hover{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost:hover{background:var(--card)}
.photo{aspect-ratio:4/5;border-radius:200px 200px 24px 24px;overflow:hidden;background:linear-gradient(160deg,var(--accent),#12172B);display:grid;place-items:center;color:#fff;font-family:var(--head);font-size:96px;font-weight:800}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding-top:40px}.photo{max-width:320px;order:-1}}

/* sections */
section{padding:64px 0;border-top:1px solid var(--line)}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:32px;flex-wrap:wrap}
.sec-head h2{font-size:clamp(30px,4.5vw,48px);position:relative;padding-bottom:12px}
.sec-head p{color:var(--muted);max-width:44ch}
/* heading effect: accent line draws in, dot pops, line stretches when the section is hovered */
.sec-head h2::after{content:"";position:absolute;left:0;bottom:0;height:4px;width:100%;border-radius:4px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .9s cubic-bezier(.2,.7,.2,1) .25s}
.sec-head h2::before{content:"";position:absolute;left:calc(32% + 6px);bottom:-3px;width:10px;height:10px;border-radius:50%;background:var(--accent);transform:scale(0);transition:transform .5s cubic-bezier(.3,1.6,.5,1) 1s}
.sec-head.in h2::after{transform:scaleX(.32)}
.sec-head.in h2::before{transform:scale(1)}
section:hover .sec-head.in h2::after{transform:scaleX(.6)}
section:hover .sec-head.in h2::before{left:calc(60% + 6px)}
.sec-head h2::before{transition:transform .5s cubic-bezier(.3,1.6,.5,1) 1s,left .6s cubic-bezier(.2,.7,.2,1)}
.grid{display:grid;gap:20px}
.reels{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.long{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.thumbs{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.logos{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.social{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}

.item{display:block;position:relative;border-radius:16px;overflow:hidden;background:var(--card);border:1px solid var(--line);text-decoration:none;cursor:pointer;padding:0;font:inherit;color:inherit;text-align:left;width:100%}
.item:hover .thumb{transform:scale(1.04)}
.frame{overflow:hidden;position:relative}
.r916{aspect-ratio:9/16}.r169{aspect-ratio:16/9}.r11{aspect-ratio:1/1}.r45{aspect-ratio:4/5}.r728{aspect-ratio:728/90}
.thumb{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
.ph{width:100%;height:100%;display:grid;place-items:center;padding:16px;text-align:center;color:#fff;font-family:var(--head);font-weight:700;font-size:18px}
.play{position:absolute;right:12px;bottom:12px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center}
.play::after{content:"";border-left:13px solid #12172B;border-top:8px solid transparent;border-bottom:8px solid transparent;margin-left:3px}
.cap{padding:12px 14px}
.cap b{display:block;font-family:var(--head);font-size:17px;line-height:1.2}
.cap span{color:var(--muted);font-size:14px}

/* carousel */
.grid.car{display:flex;gap:20px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:4px 2px 10px}
.grid.car::-webkit-scrollbar{display:none}
.car .item{flex:0 0 min(var(--w,280px),82vw);scroll-snap-align:start}
#thumbs .car{--w:360px}#logos .car{--w:250px}#social .car{--w:290px}#gifs .car{--w:728px}#banners .car{--w:480px}
.arrows{display:flex;gap:8px;margin-left:auto}
.arrows button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;cursor:pointer;transition:transform .2s,background .2s,color .2s}
.arrows button:hover:not(:disabled){background:var(--accent);color:var(--accent-ink);transform:scale(1.08)}
.arrows button:disabled{opacity:.35;cursor:default}
.thumb.fit{object-fit:contain;background:var(--card)}
.item:hover .thumb.fit{transform:none}

/* stats */
.stats{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:20px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px;display:flex;flex-direction:column;justify-content:space-between;gap:18px}
.stat.big{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stat .num{font-family:var(--head);font-weight:800;font-size:clamp(44px,7vw,88px);line-height:1;letter-spacing:-.03em}
.stat.big .num{font-size:clamp(64px,11vw,128px)}
.stat .lab{font-size:15px;opacity:.8}
.pl{display:flex;flex-wrap:wrap;gap:8px}
.pl span{display:inline-flex;align-items:center;gap:7px;border:1px solid currentColor;border-radius:99px;padding:6px 12px 6px 9px;font-size:14px;font-weight:500;opacity:.9}
.pl svg{width:16px;height:16px;fill:currentColor}
@media(max-width:820px){.stats{grid-template-columns:1fr 1fr}.stat.big{grid-column:1/-1}}

/* animation */
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1),box-shadow .3s,border-color .3s}
.rv.in{opacity:1;transform:none}
.item.rv.in:hover{transform:translateY(-6px);box-shadow:0 16px 32px -14px rgba(18,23,43,.4);border-color:var(--accent)}
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translateY(-10px)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,255,255,.55)}70%{box-shadow:0 0 0 12px rgba(255,255,255,0)}100%{box-shadow:0 0 0 0 rgba(255,255,255,0)}}
.hero h1,.hero .role,.hero p,.hero .btns,.hero .soc{animation:fadeUp .8s cubic-bezier(.2,.7,.2,1) both}
.hero .role{animation-delay:.12s}.hero p{animation-delay:.24s}.hero .btns{animation-delay:.36s}.hero .soc{animation-delay:.48s}
.photo{animation:float 6s ease-in-out infinite}
.play{animation:pulse 2.4s infinite}
.tool,.chip,.soc a{transition:transform .25s,border-color .25s,color .25s}
.tool:hover,.chip:hover,.soc a:hover{transform:translateY(-3px)}
.btn{transition:transform .25s,background .25s,color .25s}.btn:hover{transform:translateY(-3px)}
.bar{position:fixed;top:0;left:0;height:3px;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;z-index:60}

/* tools + about */
.about{display:grid;grid-template-columns:1fr 1fr;gap:56px}
@media(max-width:820px){.about{grid-template-columns:1fr}}
.about p{color:var(--muted);margin-bottom:14px}
.about h3{font-size:24px;margin-bottom:14px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 16px;font-size:15px;font-weight:500}
.exp{list-style:none;padding:0;display:grid;gap:14px}
.exp li{border-left:3px solid var(--accent);padding-left:14px}
.exp b{font-family:var(--head);display:block}
.exp span{color:var(--muted);font-size:15px}

/* tool badges + social icons */
.tool{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:8px 16px 8px 8px;font-weight:500;font-size:15px}
.tool .ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-family:var(--head);font-weight:800;font-size:14px;letter-spacing:-.03em;flex:none;overflow:hidden}
.tool .ic img{width:100%;height:100%;object-fit:contain}
.tools{display:flex;flex-wrap:wrap;gap:10px}
.soc{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.soc a{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px 8px 10px;text-decoration:none;font-size:14px;font-weight:500}
.soc a:hover{border-color:var(--accent);color:var(--accent)}
.soc svg{width:18px;height:18px;fill:currentColor}
.soc .bt{font-family:var(--head);font-weight:800;font-size:13px;width:18px;text-align:center}

/* contact */
.contact h2{font-size:clamp(36px,6vw,68px);max-width:14ch}
.cta{display:flex;flex-wrap:wrap;gap:18px 22px;align-items:center;margin-top:22px}
.contact .mail{display:inline-block;font-family:var(--head);font-size:clamp(20px,3vw,30px);font-weight:700;border-bottom:3px solid var(--accent);text-decoration:none}
.btn.wa{display:inline-flex;align-items:center;gap:10px;background:#25D366;border-color:#25D366;color:#06301A;padding:14px 26px;font-size:16px}
.btn.wa:hover{background:#1DA851;border-color:#1DA851;color:#fff}
.btn.wa svg{width:20px;height:20px;fill:currentColor}
.socials{display:flex;gap:18px;flex-wrap:wrap;margin-top:28px;color:var(--muted)}
.socials a{text-decoration:none;border-bottom:1px solid var(--line)}
.socials a:hover{color:var(--ink)}
footer{padding:28px 0 40px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(10,12,24,.88);display:none;place-items:center;z-index:50;padding:20px}
.lb.open{display:grid}
.lb-in{max-width:min(960px,100%);max-height:100%;width:100%;display:grid;place-items:center}
.lb-in img{max-width:100%;max-height:86vh;border-radius:12px}
.lb-in iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:12px;max-height:86vh}
.lb-in iframe.v{aspect-ratio:9/16;height:86vh;width:auto;max-width:100%}
.lb-in video{max-width:100%;max-height:86vh;border-radius:12px;background:#000}
.lb-x{position:absolute;top:14px;right:18px;background:#fff;color:#12172B;border:0;border-radius:99px;padding:8px 16px;font:inherit;font-weight:700;cursor:pointer}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}.sec-head h2::after{transform:scaleX(.32)}.sec-head h2::before{transform:scale(1)}}
</style>
</head>
<body>
<div class="bar" id="bar"></div>

<header><div class="wrap"><nav>
  <a class="logo" href="#top" id="navName"></a>
  <div class="links" id="navLinks"></div>
  <button class="theme" id="themeBtn" aria-label="Switch light or dark theme">Theme</button>
</nav></div></header>

<main id="top" class="wrap">
  <div class="hero">
    <div>
      <h1 id="heroName"></h1>
      <div class="role" id="heroRole"></div>
      <p id="heroIntro"></p>
      <div class="btns">
        <a class="btn main" href="#reels">See my work</a>
        <a class="btn ghost" href="#contact">Contact me</a>
      </div>
      <div class="soc" id="heroSoc"></div>
    </div>
    <div class="photo" id="photo"></div>
  </div>

  <section id="stats"><div class="sec-head"><h2>Reach</h2><p id="statsNote"></p></div><div class="stats" id="statsGrid"></div></section>
  <section id="reels"><div class="sec-head"><h2>Reels</h2><p id="reelsNote"></p></div><div class="grid reels" id="reelsGrid"></div></section>
  <section id="long"><div class="sec-head"><h2>Long-form video</h2><p id="longNote"></p></div><div class="grid long" id="longGrid"></div></section>
  <section id="thumbs"><div class="sec-head"><h2>Thumbnail design</h2><p id="thumbsNote"></p></div><div class="grid thumbs" id="thumbsGrid"></div></section>
  <section id="logos"><div class="sec-head"><h2>Logo design</h2><p id="logosNote"></p></div><div class="grid logos" id="logosGrid"></div></section>
  <section id="social"><div class="sec-head"><h2>Social media design</h2><p id="socialNote"></p></div><div class="grid social" id="socialGrid"></div></section>
  <section id="gifs"><div class="sec-head"><h2>GIF ads</h2><p id="gifsNote"></p></div><div class="grid" id="gifsGrid"></div></section>
  <section id="banners"><div class="sec-head"><h2>Website banners</h2><p id="bannersNote"></p></div><div class="grid" id="bannersGrid"></div></section>

  <section id="about"><div class="about">
    <div>
      <div class="sec-head"><h2>About me</h2></div>
      <div id="aboutText"></div>
      <h3 style="margin-top:28px">Experience</h3>
      <ul class="exp" id="expList"></ul>
    </div>
    <div>
      <h3>Tools and skills</h3>
      <div class="tools" id="toolChips"></div>
      <h3 style="margin-top:28px">Services</h3>
      <div class="chips" id="serviceChips"></div>
    </div>
  </div></section>

  <section id="contact" class="contact">
    <h2 id="contactTitle"></h2>
    <div class="cta">
      <a class="mail" id="mail"></a>
      <a class="btn wa" id="wa" target="_blank" rel="noopener"></a>
    </div>
    <div class="soc" id="socials"></div>
  </section>
</main>

<footer><div class="wrap" id="foot"></div></footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Preview"><button class="lb-x" id="lbX">Close</button><div class="lb-in" id="lbIn"></div></div>

function ytId(u){
  const m = String(u||"").match(/(?:youtube\.com\/(?:watch\?v=|shorts\/)|youtu\.be\/)([\w-]{6,})/);
  return m ? m[1] : "";
}
function card(it, i, ratio, kind, fit){
  const media = (it.thumb || it.image)
    ? `<img class="thumb${fit?" fit":""}" loading="lazy" src="${esc(it.thumb || it.image)}" alt="${esc(it.title)}">`
    : ytId(it.link)
    ? `<img class="thumb" loading="lazy" src="https://img.youtube.com/vi/${ytId(it.link)}/maxresdefault.jpg" onerror="this.onerror=null;this.src='https://img.youtube.com/vi/${ytId(it.link)}/hqdefault.jpg'" alt="${esc(it.title)}">`
    : it.video
    ? `<video class="thumb" src="${esc(it.video)}#t=0.5" preload="metadata" muted playsinline></video>`
    : `<div class="ph" style="background:linear-gradient(150deg,${grads[i % grads.length]})">${esc(it.title)}</div>`;
  const play = kind === "video" ? '<span class="play"></span>' : "";
  return `<button class="item" data-kind="${kind}" data-i="${i}"><div class="frame ${ratio}">${media}${play}</div>
    <div class="cap"><b>${esc(it.title)}</b><span>${esc(it.tag)}</span></div></button>`;
}

const sets = {reels:["r916","video"], long:["r169","video"], thumbs:["r169","image",1], logos:["r11","image",1], social:["r11","image",1], gifs:["r728","image",1,1], banners:["r169","image",1,1]};
let carIndex = 0;
Object.keys(sets).forEach(k => {
  const [ratio, kind, car, fit] = sets[k], g = $(k+"Grid");
  g.innerHTML = SITE[k].map((it,i) => card(it,i,ratio,kind,fit)).join("");
  g.dataset.set = k;
  if (car) {
    g.classList.add("car");
    const box = document.createElement("div"); box.className = "arrows";
    box.innerHTML = '<button aria-label="Previous">&#8592;</button><button aria-label="Next">&#8594;</button>';
    $(k).querySelector(".sec-head").appendChild(box);
    const [prev, next] = box.children;
    const upd = () => { prev.disabled = g.scrollLeft < 4; next.disabled = g.scrollLeft + g.clientWidth >= g.scrollWidth - 4; };
    prev.onclick = () => g.scrollBy({left: -g.clientWidth * .85, behavior: "smooth"});
    next.onclick = () => g.scrollBy({left:  g.clientWidth * .85, behavior: "smooth"});
    g.addEventListener("scroll", upd, {passive:true}); addEventListener("resize", upd); upd();

    /* auto scroll: moves one card every few seconds, loops back to the start,
       pauses on hover, touch, focus, while a preview is open, or when off screen */
    if (!reduceMotion) {
      let paused = false, visible = false, resume;
      const hold = () => { paused = true; clearTimeout(resume); };
      const letGo = (ms) => { clearTimeout(resume); resume = setTimeout(() => paused = false, ms); };
      g.addEventListener("mouseenter", hold);
      g.addEventListener("mouseleave", () => letGo(300));
      g.addEventListener("focusin", hold);
      g.addEventListener("focusout", () => letGo(300));
      g.addEventListener("touchstart", hold, {passive:true});
      g.addEventListener("touchend", () => letGo(4000), {passive:true});
      box.addEventListener("click", () => { hold(); letGo(5000); });
      if ("IntersectionObserver" in window) new IntersectionObserver(es => visible = es[0].isIntersecting, {threshold:.25}).observe(g);
      else visible = true;
      setInterval(() => {
        if (paused || !visible || document.hidden || $("lb").classList.contains("open")) return;
        const first = g.firstElementChild; if (!first) return;
        if (g.scrollLeft + g.clientWidth >= g.scrollWidth - 4) g.scrollTo({left:0, behavior:"smooth"});
        else g.scrollBy({left: first.getBoundingClientRect().width + 20, behavior:"smooth"});
      }, 3000 + (carIndex++) * 350);
    }
  }
});

/* statistics */
(function(){
  const S = SITE.stats;
  const pl = S.platforms.map(p => `<span>${ICONS[p.toLowerCase()] || ""}${esc(p)}</span>`).join("");
  const num = (n, s) => `<div class="num"><span class="count" data-to="${n}">0</span>${esc(s)}</div>`;
  $("statsGrid").innerHTML =
    `<div class="stat big">${num(S.views, S.suffix)}<div><div class="lab" style="margin-bottom:14px">${esc(S.label)}</div><div class="pl">${pl}</div></div></div>` +
    S.extras.map(e => `<div class="stat">${num(e.n, e.s)}<div class="lab">${esc(e.l)}</div></div>`).join("");
  const run = el => {
    const to = +el.dataset.to;
    if (reduceMotion) { el.textContent = to; return; }
    const t0 = performance.now(), dur = 1800;
    const step = t => {
      const p = Math.min(1, (t - t0) / dur);
      el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3)));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  };
  const els = document.querySelectorAll(".count");
  if ("IntersectionObserver" in window) {
    const o = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { run(e.target); o.unobserve(e.target); } }), {threshold:.4});
    els.forEach(el => o.observe(el));
  } else els.forEach(el => el.textContent = el.dataset.to);
})();

/* lightbox */
const lb = $("lb"), lbIn = $("lbIn");
function embedUrl(u){
  let m = u.match(/youtube\.com\/shorts\/([\w-]{6,})/); if (m) return [`https://www.youtube.com/embed/${m[1]}?autoplay=1`, true];
  m = u.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/)([\w-]{6,})/); if (m) return [`https://www.youtube.com/embed/${m[1]}?autoplay=1`, false];
  m = u.match(/instagram\.com\/(?:reel|reels|p)\/([\w-]+)/); if (m) return [`https://www.instagram.com/reel/${m[1]}/embed`, true];
  m = u.match(/vimeo\.com\/(\d+)/); if (m) return [`https://player.vimeo.com/video/${m[1]}?autoplay=1`, false];
  return null;
}
function openLB(html){ lbIn.innerHTML = html; lb.classList.add("open"); $("lbX").focus(); }
function closeLB(){ lb.classList.remove("open"); lbIn.innerHTML = ""; }
document.addEventListener("click", e => {
  const b = e.target.closest(".item"); if (!b) return;
  const set = b.parentElement.dataset.set, it = SITE[set][b.dataset.i];
  if (b.dataset.kind === "video") {
    if (it.video) { openLB(`<video src="${esc(it.video)}" controls autoplay playsinline ${it.thumb ? 'poster="'+esc(it.thumb)+'"' : ''}></video>`); return; }
    if (!it.link || /XXXX/.test(it.link)) return;
    const em = embedUrl(it.link);
    if (em) openLB(`<iframe class="${em[1]?"v":""}" src="${em[0]}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen title="${esc(it.title)}"></iframe>`);
    else window.open(it.link, "_blank", "noopener");
  } else if (it.image) {
    openLB(`<img src="${esc(it.image)}" alt="${esc(it.title)}">`);
  }
});
$("lbX").onclick = closeLB;
lb.addEventListener("click", e => { if (e.target === lb) closeLB(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeLB(); });

/* scroll animation */
const rvEls = document.querySelectorAll(".item,.sec-head,.stat,.tool,.chip,.exp li,.about p,.about h3,.contact > *");
rvEls.forEach(el => {
  el.classList.add("rv");
  const idx = [...el.parentElement.children].indexOf(el);
  el.style.transitionDelay = Math.min(idx, 6) * 70 + "ms";
});
if ("IntersectionObserver" in window) {
  const io = new IntersectionObserver(es => es.forEach(e => {
    if (!e.isIntersecting) return;
    e.target.classList.add("in"); io.unobserve(e.target);
    setTimeout(() => e.target.style.transitionDelay = "0ms", 1200);
  }), {threshold: .12});
  rvEls.forEach(el => io.observe(el));
} else rvEls.forEach(el => el.classList.add("in"));
const bar = $("bar");
addEventListener("scroll", () => {
  const h = document.documentElement;
  bar.style.transform = "scaleX(" + (h.scrollTop / Math.max(1, h.scrollHeight - h.clientHeight)) + ")";
}, {passive:true});

/* theme toggle */
$("themeBtn").onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
};
